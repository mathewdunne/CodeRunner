#cloud-config
# CodeRunner GCE first-boot provisioning (containerized control plane).
#
# This file is templated by Terraform: ${domain}, ${git_ref}, ${github_repo},
# ${instance_label} are substituted in vm.tf via templatefile(). Anything
# secret comes from Secret Manager at runtime via render-env.sh — NOT from
# this file.
#
# The control plane runs as a Docker container (ghcr.io/.../coderunner-control)
# orchestrated by docker compose; Caddy (TLS) and Grafana Alloy (telemetry) run
# as sibling containers via docker-compose.prod.yml. The host installs only
# Docker + the compose plugin. See docs/decisions/031-containerized-control-plane.md.

write_files:
  - path: /etc/coderunner/deploy.env
    permissions: "0644"
    content: |
      DOMAIN=${domain}
      GITHUB_REPO=${github_repo}
      INITIAL_GIT_REF=${git_ref}
      COMPOSE_DIR=/opt/coderunner
      DATA_DIR=/var/lib/coderunner/data
      APP_USER=coderunner

  - path: /opt/coderunner/render-env.sh
    permissions: "0750"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      # Materialize /opt/coderunner/.env and /opt/coderunner/alloy/config.alloy
      # from Secret Manager. Runs from bootstrap.sh on first boot and from the
      # VM's metadata_startup_script on every subsequent boot.
      #
      # Exit codes:
      #   0  — all required secrets fetched; .env and alloy config written
      #   1  — one or more required secrets missing, OR a fetch hit a
      #        non-NOT_FOUND error (auth/IAM/network). The existing .env is
      #        NOT overwritten on failure, so a transient gcloud blip can't
      #        wipe a previously-working config.
      set -euo pipefail
      shopt -s inherit_errexit
      source /etc/coderunner/deploy.env

      # Distinguish "no version added yet" (first-boot, soft) from real errors
      # (auth, IAM, network — hard). Hard errors propagate; soft returns empty
      # and lets the post-fetch validation produce a single clear message.
      fetch() {
        local name="$1" out rc=0
        out="$(gcloud secrets versions access latest --secret="$name" 2>&1)" || rc=$?
        if [ $rc -eq 0 ]; then
          printf '%s' "$out"
          return 0
        fi
        if echo "$out" | grep -qE 'NOT_FOUND|no versions|does not exist'; then
          printf ''
          return 0
        fi
        echo "render-env: hard error fetching $name: $out" >&2
        return 1
      }

      BETTER_AUTH_SECRET="$(fetch coderunner-better-auth-secret)"
      GH_CLIENT_ID="$(fetch coderunner-github-client-id)"
      GH_CLIENT_SECRET="$(fetch coderunner-github-client-secret)"
      GOOG_CLIENT_ID="$(fetch coderunner-google-client-id)"
      GOOG_CLIENT_SECRET="$(fetch coderunner-google-client-secret)"
      # Optional: Auth0 is enabled only when all three are populated.
      AUTH0_DOMAIN_VAL="$(fetch coderunner-auth0-domain)"
      AUTH0_CLIENT_ID_VAL="$(fetch coderunner-auth0-client-id)"
      AUTH0_CLIENT_SECRET_VAL="$(fetch coderunner-auth0-client-secret)"
      ADMIN_TOKEN_VAL="$(fetch coderunner-admin-token)"
      METRICS_TOKEN_VAL="$(fetch coderunner-metrics-token)"
      GC_URL="$(fetch coderunner-grafana-cloud-url)"
      GC_USER="$(fetch coderunner-grafana-cloud-user)"
      GC_TOKEN="$(fetch coderunner-grafana-cloud-token)"
      GC_LOKI_URL="$(fetch coderunner-grafana-cloud-loki-url)"
      GC_LOKI_USER="$(fetch coderunner-grafana-cloud-loki-user)"

      required=(
        BETTER_AUTH_SECRET GH_CLIENT_ID GH_CLIENT_SECRET
        GOOG_CLIENT_ID GOOG_CLIENT_SECRET ADMIN_TOKEN_VAL METRICS_TOKEN_VAL
        GC_URL GC_USER GC_TOKEN GC_LOKI_URL GC_LOKI_USER
      )
      missing=()
      for n in "$${required[@]}"; do
        if [ -z "$${!n}" ]; then
          missing+=("$n")
        fi
      done
      if [ "$${#missing[@]}" -gt 0 ]; then
        echo "render-env: missing secrets: $${missing[*]}" >&2
        echo "  populate via 'gcloud secrets versions add' (deploy/README.md step 5)," >&2
        echo "  then 'gcloud compute instances reset coderunner'." >&2
        exit 1
      fi

      # Preserve the deployed image tag across reboots. The deploy workflow
      # writes CODERUNNER_TAG into this file; default to latest on first boot.
      CODERUNNER_TAG="latest"
      if [ -f "$${COMPOSE_DIR}/.env" ]; then
        existing="$(grep -E '^CODERUNNER_TAG=' "$${COMPOSE_DIR}/.env" | tail -1 | cut -d= -f2- || true)"
        if [ -n "$${existing}" ]; then
          CODERUNNER_TAG="$${existing}"
        fi
      fi

      tmp="$(mktemp)"
      chmod 600 "$tmp"
      # ─── Compose + control-plane env ─────────────────────────────────
      # Source of truth for /opt/coderunner/.env in prod. Compose interpolates
      # the CODERUNNER_*/COMPOSE_FILE values into docker-compose*.yml and passes
      # the whole file into the control container (env_file). Hand-edits here are
      # clobbered on every boot. Do NOT set FRC_DATA_DIR/FRC_DB_PATH — the image
      # fixes the in-container paths and overriding them breaks the container.
      # See deploy/README.md → "Changing control-plane env vars".
      {
        echo "# Auto-generated by render-env.sh. Do not edit by hand."
        # Image namespace follows the repo owner (lowercased for GHCR), so a
        # fork's VM pulls the fork's own images, not upstream's.
        echo "CODERUNNER_IMAGE_NS=ghcr.io/$(echo "$${GITHUB_REPO%%/*}" | tr '[:upper:]' '[:lower:]')"
        echo "CODERUNNER_TAG=$${CODERUNNER_TAG}"
        echo "CODERUNNER_HOST_DATA_DIR=$${DATA_DIR}"
        echo "COMPOSE_FILE=docker-compose.yml:docker-compose.prod.yml"
        echo "BETTER_AUTH_URL=https://$${DOMAIN}"
        echo "BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET"
        echo "GITHUB_CLIENT_ID=$GH_CLIENT_ID"
        echo "GITHUB_CLIENT_SECRET=$GH_CLIENT_SECRET"
        echo "GOOGLE_CLIENT_ID=$GOOG_CLIENT_ID"
        echo "GOOGLE_CLIENT_SECRET=$GOOG_CLIENT_SECRET"
        if [ -n "$AUTH0_DOMAIN_VAL" ] && [ -n "$AUTH0_CLIENT_ID_VAL" ] && [ -n "$AUTH0_CLIENT_SECRET_VAL" ]; then
          echo "AUTH0_DOMAIN=$AUTH0_DOMAIN_VAL"
          echo "AUTH0_CLIENT_ID=$AUTH0_CLIENT_ID_VAL"
          echo "AUTH0_CLIENT_SECRET=$AUTH0_CLIENT_SECRET_VAL"
        fi
        echo "ADMIN_TOKEN=$ADMIN_TOKEN_VAL"
        echo "METRICS_TOKEN=$METRICS_TOKEN_VAL"
        echo "CODE_MEMORY_LIMIT=4096m"
        echo "IDLE_STOP_MINUTES=10"
        echo "LOG_LEVEL=info"
        # JSON logs flow stdout → docker json-file → Alloy loki.source.docker →
        # Grafana Cloud Loki. Don't change without updating that pipeline below.
        echo "LOG_FORMAT=json"
        echo "LESSONS_CATALOG_REPO=mathewdunne/CodeRunner-Lessons"
        # Run the control container as the APP_USER that owns DATA_DIR (chowned
        # above), not root, so /data writes and the derived workspace uid line
        # up. The docker group gid lets the non-root process reach the socket.
        echo "CODERUNNER_UID=$(id -u "$${APP_USER}")"
        echo "CODERUNNER_GID=$(id -g "$${APP_USER}")"
        echo "CODERUNNER_DOCKER_GID=$(getent group docker | cut -d: -f3)"
        # Add new control-plane env vars above this line.
      } > "$tmp"
      install -o "$${APP_USER}" -g "$${APP_USER}" -m 600 "$tmp" "$${COMPOSE_DIR}/.env"
      rm -f "$tmp"

      # Render Alloy config. The grafana/alloy container runs as root and bind
      # mounts this read-only, so 0600 root:root keeps the tokens off other host
      # users while staying readable by the container.
      mkdir -p "$${COMPOSE_DIR}/alloy"
      alloy_tmp="$(mktemp)"
      chmod 600 "$alloy_tmp"
      METRICS_TOKEN="$METRICS_TOKEN_VAL" \
      GC_URL="$GC_URL" \
      GC_USER="$GC_USER" \
      GC_TOKEN="$GC_TOKEN" \
      GC_LOKI_URL="$GC_LOKI_URL" \
      GC_LOKI_USER="$GC_LOKI_USER" \
        envsubst < "$${COMPOSE_DIR}/alloy/config.alloy.tmpl" > "$alloy_tmp"
      install -o root -g root -m 600 "$alloy_tmp" "$${COMPOSE_DIR}/alloy/config.alloy"
      rm -f "$alloy_tmp"

  - path: /opt/coderunner/caddy/Caddyfile
    permissions: "0644"
    owner: root:root
    content: |
      # The main domain handles direct (single-machine) access.
      # origin.${domain} is the backend target for the Cloudflare Worker proxy;
      # it must be a DNS-only (grey-cloud) record pointing at this VM's IP.
      # Caddy (running as a container) auto-provisions Let's Encrypt certs and
      # reaches the control plane over the compose network as `control`.
      ${domain} {
        reverse_proxy control:4000
        encode gzip
      }

      origin.${domain} {
        reverse_proxy control:4000
        encode gzip
      }

  - path: /opt/coderunner/alloy/config.alloy.tmpl
    permissions: "0644"
    owner: root:root
    content: |
      // Grafana Alloy config template. render-env.sh substitutes $METRICS_TOKEN,
      // $GC_URL, $GC_USER, $GC_TOKEN, $GC_LOKI_URL, $GC_LOKI_USER at boot and
      // writes /opt/coderunner/alloy/config.alloy (mode 600 root:root).
      // Alloy runs as a container on the `coderunner` compose network.

      logging {
        level  = "info"
        format = "logfmt"
      }

      // ─── Scrape: control plane /metrics (requires bearer auth) ───────
      // Reached by service name over the compose network.
      prometheus.scrape "coderunner" {
        targets = [
          { __address__ = "control:4000", job = "coderunner" },
        ]
        metrics_path = "/metrics"
        scrape_interval = "30s"
        bearer_token = "$METRICS_TOKEN"
        forward_to = [prometheus.remote_write.grafana_cloud.receiver]
      }

      // ─── Host metrics: CPU, memory, disk, network ────────────────────
      // Alloy is containerized, so the unix exporter reads the host's
      // filesystems via the bind mounts in docker-compose.prod.yml.
      prometheus.exporter.unix "host" {
        include_exporter_metrics = false
        procfs_path = "/host/proc"
        sysfs_path  = "/host/sys"
        rootfs_path = "/rootfs"
      }

      prometheus.scrape "host" {
        targets    = prometheus.exporter.unix.host.targets
        job_name   = "node"
        scrape_interval = "30s"
        forward_to = [prometheus.remote_write.grafana_cloud.receiver]
      }


      // ─── Ship to Grafana Cloud ───────────────────────────────────────
      prometheus.remote_write "grafana_cloud" {
        endpoint {
          url = "$GC_URL"
          basic_auth {
            username = "$GC_USER"
            password = "$GC_TOKEN"
          }
        }
        external_labels = {
          instance   = "${instance_label}",
          deployment = "gce",
        }
      }

      // ─── Logs: tail the control container's stdout via the Docker API ─
      // The control plane logs NDJSON to stdout (LOG_FORMAT=json), captured by
      // Docker's json-file driver. discovery.docker finds containers; we keep
      // only the compose `control` service and copy its service name into a
      // `unit` label, then extract `level`/`category` from the JSON body.
      // Everything else (workspaceId, runId, durationMs, …) stays in the body
      // and is accessed via `| json` at query time — keeps active series bounded.
      discovery.docker "containers" {
        host = "unix:///var/run/docker.sock"
      }

      discovery.relabel "control" {
        targets = discovery.docker.containers.targets
        rule {
          source_labels = ["__meta_docker_container_label_com_docker_compose_service"]
          regex         = "^control$"
          action        = "keep"
        }
        rule {
          source_labels = ["__meta_docker_container_label_com_docker_compose_service"]
          target_label  = "unit"
        }
      }

      loki.source.docker "coderunner" {
        host       = "unix:///var/run/docker.sock"
        targets    = discovery.relabel.control.output
        forward_to = [loki.process.coderunner.receiver]
        labels     = { job = "coderunner" }
      }

      loki.process "coderunner" {
        forward_to = [loki.write.grafana_cloud_logs.receiver]
        stage.json {
          expressions = { level = "level", category = "category" }
        }
        stage.labels {
          values = { level = "", category = "" }
        }
      }

      loki.write "grafana_cloud_logs" {
        endpoint {
          url = "$GC_LOKI_URL"
          basic_auth {
            // Loki's user ID is distinct from Prometheus's (each datasource
            // has its own instance ID in Grafana Cloud) but the access
            // policy token is shared if it carries both metrics:write
            // and logs:write scopes.
            username = "$GC_LOKI_USER"
            password = "$GC_TOKEN"
          }
        }
        external_labels = {
          instance   = "${instance_label}",
          deployment = "gce",
        }
      }

  - path: /opt/coderunner/bootstrap.sh
    permissions: "0750"
    owner: root:root
    content: |
      #!/usr/bin/env bash
      # First-boot provisioning. Idempotent — safe to re-run.
      #
      # The control plane, Caddy, and Alloy all run as containers via docker
      # compose. The host installs only Docker + the compose plugin and fetches
      # the compose files from the repo. Application images come from GHCR
      # (pulled by the deploy workflow / first `docker compose up`).
      set -euo pipefail
      source /etc/coderunner/deploy.env

      log() { echo "[bootstrap] $*"; }

      # ─── Packages ──────────────────────────────────────────────────────
      export DEBIAN_FRONTEND=noninteractive
      apt-get update -y
      apt-get install -y \
        ca-certificates curl git jq gnupg lsb-release gettext-base

      # ─── Docker Engine + compose plugin ─────────────────────────────────
      if ! command -v docker >/dev/null; then
        log "installing Docker Engine"
        install -m 0755 -d /etc/apt/keyrings
        curl -fsSL https://download.docker.com/linux/ubuntu/gpg \
          | gpg --dearmor -o /etc/apt/keyrings/docker.gpg
        chmod a+r /etc/apt/keyrings/docker.gpg
        echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.gpg] \
          https://download.docker.com/linux/ubuntu $(lsb_release -cs) stable" \
          > /etc/apt/sources.list.d/docker.list
        apt-get update -y
      fi
      apt-get install -y \
        docker-ce docker-ce-cli containerd.io docker-compose-plugin

      # ─── App user ──────────────────────────────────────────────────────
      # Owns the data disk; workspace containers run as this uid:gid.
      if ! id -u "$${APP_USER}" >/dev/null 2>&1; then
        log "creating $${APP_USER} user"
        useradd --system --create-home --shell /bin/bash --home-dir /home/$${APP_USER} "$${APP_USER}"
      fi
      usermod -aG docker "$${APP_USER}"

      # ─── Data disk ─────────────────────────────────────────────────────
      DEV=/dev/disk/by-id/google-coderunner-data
      if [ -e "$DEV" ]; then
        if ! blkid "$DEV" >/dev/null 2>&1; then
          log "formatting fresh data disk"
          mkfs.ext4 -F -L coderunner-data "$DEV"
        fi
        mkdir -p "$${DATA_DIR}"
        if ! grep -q coderunner-data /etc/fstab; then
          echo "LABEL=coderunner-data $${DATA_DIR} ext4 defaults,nofail 0 2" >> /etc/fstab
        fi
        mount -a
        # Own the data dir as the app user: the containerized control plane
        # stat()s this directory to derive the uid:gid that workspace containers
        # run as, so student files are not created as root.
        chown -R "$${APP_USER}:$${APP_USER}" "$${DATA_DIR}"
      else
        log "WARN: data disk not present at $DEV"
      fi

      # ─── Compose files ──────────────────────────────────────────────────
      # Fetched from the repo at the pinned ref so the VM can boot before the
      # first deploy. The deploy workflow overwrites these with the deployed
      # tag's versions on every release.
      mkdir -p "$${COMPOSE_DIR}"
      chown "$${APP_USER}:$${APP_USER}" "$${COMPOSE_DIR}"
      RAW="https://raw.githubusercontent.com/$${GITHUB_REPO}/$${INITIAL_GIT_REF}"
      for f in docker-compose.yml docker-compose.prod.yml; do
        log "fetching $f"
        curl -fsSL "$${RAW}/$f" -o "$${COMPOSE_DIR}/$f"
      done

      # ─── Bring services up; gate on secrets being present ──────────────
      systemctl enable --now docker
      if /opt/coderunner/render-env.sh; then
        log "secrets present — starting compose stack"
        cd "$${COMPOSE_DIR}"
        docker compose pull
        docker compose up -d --remove-orphans
      else
        log "secrets incomplete — compose stack NOT started."
        log "  After 'gcloud secrets versions add ...' (README step 5),"
        log "  run 'gcloud compute instances reset coderunner' (README step 7)."
        log "  The metadata_startup_script will re-render env and start services."
      fi

      log "bootstrap complete"
      touch /var/log/coderunner-bootstrap-done

runcmd:
  - [bash, -lc, "/opt/coderunner/bootstrap.sh 2>&1 | tee -a /var/log/coderunner-bootstrap.log"]
